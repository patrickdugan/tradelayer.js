[package]
name = "tlzk_verifier"
version = "0.1.0"
edition = "2021"
description = "Bounded Rust/WASM verifier helpers for TLZK wallet bootstrap artifacts."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
