[package]
name = "tlzk_verifier"
version = "0.1.0"
edition = "2021"
description = "Bounded Rust/WASM verifier helpers for TLZK wallet bootstrap artifacts."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
cairo-air = { path = "../vendor/stwo-cairo/stwo_cairo_prover/crates/cairo-air", optional = true }
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
stwo = { path = "../vendor/stwo-cairo/stwo/crates/stwo", optional = true }
wasm-bindgen = "0.2"

[features]
default = []
embedded-stwo = ["dep:cairo-air", "dep:stwo"]
